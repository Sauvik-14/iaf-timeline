ey (Harappan) site &mdash; larger even than Mohenjo-daro. Excavations have revealed a planned township with brick-lined drains, a cylindrical steatite seal carved with an alligator motif and undeciphered script, terracotta and shell bangles, painted red-ware pottery, and jewelry of gold, copper and semi-precious stone.</p>"}, "group": "Haryana", "end_date": {"year": "-1900"}}, {"media": {"url": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgMzAwIj4KPHJlY3Qgd2lkdGg9IjQwMCIgaGVpZ2h0PSIzMDAiIGZpbGw9IiNmNGVjZDgiLz4KPHJlY3QgeD0iMCIgeT0iMCIgd2lkdGg9IjQwMCIgaGVpZ2h0PSI4IiBmaWxsPSIjYTU0MzJiIi8+CjxyZWN0IHg9IjEzMCIgeT0iNzAiIHdpZHRoPSIxNDAiIGhlaWdodD0iMTQwIiByeD0iNiIgZmlsbD0iI2M5YTg3NiIgc3Ryb2tlPSIjM2IyYjIwIiBzdHJva2Utd2lkdGg9IjQiLz4KPGNpcmNsZSBjeD0iMjAwIiBjeT0iMTIwIiByPSIyMCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjM2IyYjIwIiBzdHJva2Utd2lkdGg9IjQiLz4KPHBhdGggZD0iTTE3MiAxNjIgUTIwMCAxNDQgMjI4IDE2MiIgc3Ryb2tlPSIjM2IyYjIwIiBzdHJva2Utd2lkdGg9IjQiIGZpbGw9Im5vbmUiLz4KPHJlY3QgeD0iMTUwIiB5PSIxNzgiIHdpZHRoPSIxNCIgaGVpZ2h0PSIxNCIgZmlsbD0iIzNiMmIyMCIvPgo8cmVjdCB4PSIxNzQiIHk9IjE3OCIgd2lkdGg9IjE0IiBoZWlnaHQ9IjE0IiBmaWxsPSIjM2IyYjIwIi8+CjxyZWN0IHg9IjE5OCIgeT0iMTc4IiB3aWR0aD0iMTQiIGhlaWdodD0iMTQiIGZpbGw9IiMzYjJiMjAiLz4KPHJlY3QgeD0iMjIyIiB5PSIxNzgiIHdpZHRoPSIxNCIgaGVpZ2h0PSIxNCIgZmlsbD0iIzNiMmIyMCIvPgo8dGV4dCB4PSIyMDAiIHk9IjI1OCIgZm9udC1mYW1pbHk9Ikdlb3JnaWEsIHNlcmlmIiBmb250LXNpemU9IjE1IiBmaWxsPSIjM2IyYjIwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5WZWVyYXB1cmFtIENoYWxjb2xpdGhpYyBTaXRlLCBLdXJub29sPC90ZXh0Pgo8dGV4dCB4PSIyMDAiIHk9IjI3OCIgZm9udC1mYW1pbHk9Ikdlb3JnaWEsIHNlcmlmIiBmb250LXNpemU9IjEyIiBmaWxsPSIjYTU0MzJiIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXdlaWdodD0iYm9sZCI+QW5kaHJhIFByYWRlc2g8L3RleHQ+Cjwvc3ZnPg=="}, "start_date": {"year": "-2000"}, "text": {"headline": "Southern Neolithic-Chalcolithic Culture &mdash; Veerapuram, Kurnool", "text": "<p>While the Indus Valley Civilization flourished in the north, a separate Neolithic-Chalcolithic culture was developing in the Deccan. <strong>Veerapuram</strong>, in Andhra Pradesh's Kurnool district, is a well-documented site of this Southern Neolithic complex, yielding painted and polished pottery, stone tools and copper objects &mdash; broadly contemporary with, but culturally distinct from, the Harappan world.</p>"}, "group": "Andhra Pradesh", "end_date": {"year": "-1000"}}, {"media": {"url": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgMzAwIj4KPHJlY3Qgd2lkdGg9IjQwMCIgaGVpZ2h0PSIzMDAiIGZpbGw9IiNmNGVjZDgiLz4KPHJlY3QgeD0iMCIgeT0iMCIgd2lkdGg9IjQwMCIgaGVpZ2h0PSI4IiBmaWxsPSIjM2Y3ZDRmIi8+CjxyZWN0IHg9IjEzMCIgeT0iNzAiIHdpZHRoPSIxNDAiIGhlaWdodD0iMTQwIiByeD0iNiIgZmlsbD0iI2M5YTg3NiIgc3Ryb2tlPSIjM2IyYjIwIiBzdHJva2Utd2lkdGg9IjQiLz4KPGNpcmNsZSBjeD0iMjAwIiBjeT0iMTIwIiByPSIyMCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjM2IyYjIwIiBzdHJva2Utd2lkdGg9IjQiLz4KPHBhdGggZD0iTTE3MiAxNjIgUTIwMCAxNDQgMjI4IDE2MiIgc3Ryb2tlPSIjM2IyYjIwIiBzdHJva2Utd2lkdGg9IjQiIGZpbGw9Im5vbmUiLz4KPHJlY3QgeD0iMTUwIiB5PSIxNzgiIHdpZHRoPSIxNCIgaGVpZ2h0PSIxNCIgZmlsbD0iIzNiMmIyMCIvPgo8cmVjdCB4PSIxNzQiIHk9IjE3OCIgd2lkdGg9IjE0IiBoZWlnaHQ9IjE0IiBmaWxsPSIjM2IyYjIwIi8+CjxyZWN0IHg9IjE5OCIgeT0iMTc4IiB3aWR0aD0iMTQiIGhlaWdodD0iMTQiIGZpbGw9IiMzYjJiMjAiLz4KPHJlY3QgeD0iMjIyIiB5PSIxNzgiIHdpZHRoPSIxNCIgaGVpZ2h0PSIxNCIgZmlsbD0iIzNiMmIyMCIvPgo8dGV4dCB4PSIyMDAiIHk9IjI1OCIgZm9udC1mYW1pbHk9Ikdlb3JnaWEsIHNlcmlmIiBmb250LXNpemU9IjE1IiBmaWxsPSIjM2IyYjIwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5EYW9qYWxpIEhhZGluZyBOZW9saXRoaWMgU2l0ZSwgRGltYSBIYXNhbzwvdGV4dD4KPHRleHQgeD0iMjAwIiB5PSIyNzgiIGZvbnQtZmFtaWx5PSJHZW9yZ2lhLCBzZXJpZiIgZm9udC1zaXplPSIxMiIgZmlsbD0iIzNmN2Q0ZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC13ZWlnaHQ9ImJvbGQiPkFzc2FtPC90ZXh0Pgo8L3N2Zz4="}, "start_date": {"year": "-900"}, "text": {"headline": "Neolithic Culture of the Northeast &mdash; Daojali Hading", "text": "<p><strong>Daojali Hading</strong>, in Assam's Dima Hasao district, is the first stratified Neolithic site discovered in Northeast India. Excavations have uncovered cord-marked pottery, polished stone tools (celts and adzes), grinding stones, and jadeite objects pointing to trade links with East and Southeast Asia &mdash; evidence of an early craft tradition quite distinct from, but contemporaneous in spirit with, the Indus Valley world.</p>"}, "group": "Assam", "end_date": {"year": "-300"}}, {"media": {"url": "https://commons.wikimedia.org/wiki/Special:FilePath/Chaneti_Buddha_Stupa_01.jpg"}, "start_date": {"year": "-300"}, "text": {"headline": "Early Buddhist Art &mdash; Chaneti Stupa, Yamunanagar", "text": "<p>The <strong>Chaneti Stupa</strong>, near Jagadhri in Yamunanagar district, is a hemispherical baked-brick Buddhist stupa associated with the Mauryan and Kushan periods, and mentioned in the travel account of the Chinese pilgrim Xuanzang (Hiuen Tsang). It stands as Haryana's own contribution to the same centuries of Buddhist art that produced the Ajanta caves.</p>"}, "group": "Haryana", "end_date": {"year": "200"}}, {"media": {"url": "https://commons.wikimedia.org/wiki/Special:FilePath/Amaravati_Maha_Stupa_relief_at_National_Museum,_Delhii,_India,_1st-2nd_century_CE._2004.jpg"}, "start_date": {"year": "-200"}, "text": {"headline": "The Amaravati School &mdash; Andhra Pradesh's Answer to Ajanta", "text": "<p>The centuries that produced the painted caves of Ajanta also gave rise to the <strong>Amaravati School</strong> on the Krishna river in Andhra Pradesh. Carved from local white limestone under Satavahana and Ikshvaku patronage, the Great Stupa's panels depict the Jataka tales and the Buddha's life in crowded, dynamic compositions &mdash; ranked among the three great schools of ancient Indian sculpture, alongside Mathura and Gandhara.</p>"}, "group": "Andhra Pradesh", "end_date": {"year": "250"}}, {"media": {"url": "https://commons.wikimedia.org/wiki/Special:FilePath/Da-Parbatia.jpg"}, "start_date": {"year": "500"}, "text": {"headline": "Early Gupta-School Sculpture &mdash; Da Parbatia, Tezpur", "text": "<p>The stone doorframe at <strong>Da Parbatia</strong>, near Tezpur, is the oldest surviving specimen of sculptural art in Assam. Carved in the early Gupta idiom &mdash; the same broad artistic language spreading across India in the centuries after Ajanta &mdash; its jambs show the river goddesses Ganga and Yamuna with garlands, alongside foliated scrollwork.</p>"}, "group": "Assam", "end_date": {"year": "600"}}, {"media": {"url": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgMzAwIj4KPHJlY3Qgd2lkdGg9IjQwMCIgaGVpZ2h0PSIzMDAiIGZpbGw9IiNmNGVjZDgiLz4KPHJlY3QgeD0iMCIgeT0iMCIgd2lkdGg9IjQwMCIgaGVpZ2h0PSI4IiBmaWxsPSIjMmU2Zjk1Ii8+CjxyZWN0IHg9IjE2MCIgeT0iMTgwIiB3aWR0aD0iODAiIGhlaWdodD0iMzQiIGZpbGw9IiNkOGJkOGUiIHN0cm9rZT0iIzNiMmIyMCIgc3Ryb2tlLXdpZHRoPSIzIi8+Cjxwb2x5Z29uIHBvaW50cz0iMTUwLDE4MCAyNTAsMTgwIDIzNSwxNDIgMTY1LDE0MiIgZmlsbD0iI2Q4YmQ4ZSIgc3Ryb2tlPSIjM2IyYjIwIiBzdHJva2Utd2lkdGg9IjMiLz4KPHBvbHlnb24gcG9pbnRzPSIxNjUsMTQyIDIzNSwxNDIgMjIyLDEwOCAxNzgsMTA4IiBmaWxsPSIjZDhiZDhlIiBzdHJva2U9IiMzYjJiMjAiIHN0cm9rZS13aWR0aD0iMyIvPgo8cG9seWdvbiBwb2ludHM9IjE3OCwxMDggMjIyLDEwOCAyMTAsODAgMTkwLDgwIiBmaWxsPSIjZDhiZDhlIiBzdHJva2U9IiMzYjJiMjAiIHN0cm9rZS13aWR0aD0iMyIvPgo8cG9seWdvbiBwb2ludHM9IjE5MCw4MCAyMTAsODAgMjAwLDU4IiBmaWxsPSIjM2IyYjIwIi8+CjxsaW5lIHgxPSIxNjUiIHkxPSIxNDIiIHgyPSIyMzUiIHkyPSIxNDIiIHN0cm9rZT0iIzNiMmIyMCIgc3Ryb2tlLXdpZHRoPSIyIi8+CjxsaW5lIHgxPSIxNzgiIHkxPSIxMDgiIHgyPSIyMjIiIHkyPSIxMDgiIHN0cm9rZT0iIzNiMmIyMCIgc3Ryb2tlLXdpZHRoPSIyIi8+CjxyZWN0IHg9IjE4NSIgeT0iMTkwIiB3aWR0aD0iMzAiIGhlaWdodD0iMjQiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzNiMmIyMCIgc3Ryb2tlLXdpZHRoPSIzIi8+Cjx0ZXh0IHg9IjIwMCIgeT0iMjU4IiBmb250LWZhbWlseT0iR2VvcmdpYSwgc2VyaWYiIGZvbnQtc2l6ZT0iMTUiIGZpbGw9IiMzYjJiMjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiPlBlaG93YSBUZW1wbGUgU2N1bHB0dXJlcywgS3VydWtzaGV0cmE8L3RleHQ+Cjx0ZXh0IHg9IjIwMCIgeT0iMjc4IiBmb250LWZhbWlseT0iR2VvcmdpYSwgc2VyaWYiIGZvbnQtc2l6ZT0iMTIiIGZpbGw9IiMyZTZmOTUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSJib2xkIj5IYXJ5YW5hPC90ZXh0Pgo8L3N2Zz4="}, "start_date": {"year": "800"}, "text": {"headline": "Gurjara-Pratihara Temple Sculpture &mdash; Pehowa, Kurukshetra", "text": "<p>On the banks of the Saraswati at <strong>Pehowa</strong> in Kurukshetra district, ancient temple sites (including Vishvamitra ka Tila) have yielded 9th&ndash;10th century stone sculptures from the Gurjara-Pratihara and Tomara periods, depicting scenes from the Ramayana and Mahabharata &mdash; Haryana's counterpart to the temple-building energy of the Chola age further south.</p>"}, "group": "Haryana", "end_date": {"year": "950"}}, {"media": {"url": "https://commons.wikimedia.org/wiki/Special:FilePath/Sculpture_of_Uma_Maheshwar,_circa_8th_to_11th_century_CE_Bhima_Devi_Temple,_Pinjore,_Haryana.jpg"}, "start_date": {"year": "850"}, "text": {"headline": "Artifact Spotlight &mdash; River-Goddess Sculpture, Bhima Devi Museum", "text": "<p>Right beside Pinjore Gardens stands the open-air <strong>Bhima Devi Temple Museum</strong>: individual carved-stone artifacts &mdash; including this Uma-Maheshwar sculpture &mdash; recovered from a 9th&ndash;11th century Gurjara-Pratihara temple that Fidai Khan partly dismantled to build the Mughal garden. The Mughal-era garden and the older Hindu sculptures literally sit side by side.</p>"}, "group": "Haryana", "end_date": {"year": "1050"}}, {"media": {"url": "https://commons.wikimedia.org/wiki/Special:FilePath/Madan_Kamdev_Temple.jpg"}, "start_date": {"year": "900"}, "text": {"headline": "Pala-Dynasty Temple Art &mdash; Madan Kamdev, Kamrup", "text": "<p>Contemporary with the Cholas in the south, the Pala kings of Kamarupa built the <strong>Madan Kamdev</strong> temple complex near Guwahati &mdash; sometimes called the 'Khajuraho of Assam'. Its scattered ruins include richly carved pillars, lintels and door frames depicting deities, nymphs and dancers, reflecting the same era's flowering of regional temple sculpture across India.</p>"}, "group": "Assam", "end_date": {"year": "1100"}}, {"media": {"url": "https://commons.wikimedia.org/wiki/Special:FilePath/A_sculpture_at_Madan_Kamdev_temple,_Assam.jpg"}, "start_date": {"year": "950"}, "text": {"headline": "Artifact Spotlight &mdash; A Carved Deity Sculpture, Madan Kamdev", "text": "<p>Among the loose, scattered carvings at Madan Kamdev, archaeologists have documented individual sculptures &mdash; including a striking six-headed Bhairava, a four-armed Shiva, and images of nymphs and griffins &mdash; since most of the original 20-odd temples now survive only as disassembled fragments across the Dewangiri hillock, rather than as intact buildings.</p>"}, "group": "Assam", "end_date": {"year": "1150"}}, {"media": {"url": "https://commons.wikimedia.org/wiki/Special:FilePath/Draksharama_temple,_Draksharamam.jpg"}, "start_date": {"year": "1022"}, "text": {"headline": "The Chola Period in Andhra &mdash; Vengi", "text": "<p>The Chola empire's temple-building tradition reached coastal Andhra Pradesh through the <strong>Eastern Chalukyas of Vengi</strong>. A marriage alliance between the Chola princess Ammangadevi and Rajaraja Narendra led to the union of the two thrones under Kulottunga Chola I (1070 CE), and temples such as the Bhimeswara temple at Draksharama were built under this combined patronage.</p>"}, "group": "Andhra Pradesh", "end_date": {"year": "1189"}}, {"media": {"url": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgMzAwIj4KPHJlY3Qgd2lkdGg9IjQwMCIgaGVpZ2h0PSIzMDAiIGZpbGw9IiNmNGVjZDgiLz4KPHJlY3QgeD0iMCIgeT0iMCIgd2lkdGg9IjQwMCIgaGVpZ2h0PSI4IiBmaWxsPSIjYTU0MzJiIi8+CjxlbGxpcHNlIGN4PSIyMDAiIGN5PSIxNDAiIHJ4PSI3NSIgcnk9Ijg4IiBmaWxsPSIjZDhiZDhlIiBzdHJva2U9IiMzYjJiMjAiIHN0cm9rZS13aWR0aD0iNCIvPgo8Y2lyY2xlIGN4PSIxNzIiIGN5PSIxMjIiIHI9IjExIiBmaWxsPSIjM2IyYjIwIi8+CjxjaXJjbGUgY3g9IjIyOCIgY3k9IjEyMiIgcj0iMTEiIGZpbGw9IiMzYjJiMjAiLz4KPHBhdGggZD0iTTE2MyAxNjggUTIwMCAxOTUgMjM3IDE2OCIgc3Ryb2tlPSIjM2IyYjIwIiBzdHJva2Utd2lkdGg9IjUiIGZpbGw9Im5vbmUiLz4KPHBhdGggZD0iTTE1MiA4OCBRMjAwIDYwIDI0 aD0iMiIvPgo8bGluZSB4MT0iMTI1IiB5MT0iMTMwIiB4Mj0iMjc1IiB5Mj0iMTMwIiBzdHJva2U9IiMzYjJiMjAiIHN0cm9rZS13aWR0aD0iMiIvPgo8bGluZSB4MT0iMTI1IiB5MT0iMTQ1IiB4Mj0iMjc1IiB5Mj0iMTQ1IiBzdHJva2U9IiMzYjJiMjAiIHN0cm9rZS13aWR0aD0iMiIvPgo8bGluZSB4MT0iMTI1IiB5MT0iMTYwIiB4Mj0iMjc1IiB5Mj0iMTYwIiBzdHJva2U9IiMzYjJiMjAiIHN0cm9rZS13aWR0aD0iMiIvPgo8bGluZSB4MT0iMTI1IiB5MT0iMTc1IiB4Mj0iMjU1IiB5Mj0iMTc1IiBzdHJva2U9IiMzYjJiMjAiIHN0cm9rZS13aWR0aD0iMiIvPgo8dGV4dCB4PSIyMDAiIHk9IjI1OCIgZm9udC1mYW1pbHk9Ikdlb3JnaWEsIHNlcmlmIiBmb250LXNpemU9IjE1IiBmaWxsPSIjM2IyYjIwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj4xNnRoLWMuIENvcHBlci1QbGF0ZSBJbnNjcmlwdGlvbiwgR2FuZGlrb3RhPC90ZXh0Pgo8dGV4dCB4PSIyMDAiIHk9IjI3OCIgZm9udC1mYW1pbHk9Ikdlb3JnaWEsIHNlcmlmIiBmb250LXNpemU9IjEyIiBmaWxsPSIjYTU0MzJiIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXdlaWdodD0iYm9sZCI+QW5kaHJhIFByYWRlc2g8L3RleHQ+Cjwvc3ZnPg=="}, "start_date": {"year": "1550"}, "text": {"headline": "Artifact Spotlight &mdash; Copper-Plate Inscription, Gandikota", "text": "<p>A 16th-century <strong>copper-plate inscription</strong> (tamra-patra) recording Gandikota Fort's history was discovered and studied by local historian Tavva Obul Reddy. Such inscribed copper plates &mdash; a distinct, portable class of Indian artifact used to record land grants and royal orders &mdash; are among the most direct primary-source objects historians have for dating a fort's successive rulers.</p>"}, "group": "Andhra Pradesh", "end_date": {"year": "1600"}}, {"media": {"url": "https://commons.wikimedia.org/wiki/Special:FilePath/Folio_of_Hastividyarnava_glorifying_Queen_Ambika.jpg"}, "start_date": {"year": "1568"}, "text": {"headline": "Devotional Folk Painting &mdash; Sanchipat Manuscripts of Assam", "text": "<p>Just as Madhubani grew from Mithila's devotional folk-art tradition, Assam developed its own school of manuscript painting inside the Vaishnavite Satras of Majuli, born from Sankardev's Neo-Vaishnavite movement. Painted on <em>sanchipat</em> (treated bark) with natural pigments, manuscripts like the <strong>Hastividyarnava</strong> (1734 CE, commissioned by King Siva Singha) use flat, horizontal compositions on a monochrome red ground &mdash; this folio glorifies Queen Ambika.</p>"}, "group": "Assam", "end_date": {"year": "1826"}}, {"media": {"url": "https://commons.wikimedia.org/wiki/Special:FilePath/KALAMKARI_HAND_PAINTED_CLOTH_SRIKALAHASTI_AP_-_panoramio.jpg"}, "start_date": {"year": "1600"}, "text": {"headline": "Folk Narrative Painting &mdash; Kalamkari of Srikalahasti", "text": "<p>In Chittoor district's <strong>Srikalahasti</strong>, artisans have long practised <em>kalamkari</em> &mdash; hand-painted, naturally-dyed cotton cloth depicting Hindu mythological narratives (the Ramayana, Mahabharata, Puranas) drawn with a bamboo pen (<em>kalam</em>). Like Madhubani, it is a temple-linked devotional folk-painting tradition passed down through generations of a single community.</p>"}, "group": "Andhra Pradesh", "end_date": {"year": "2026"}}, {"media": {"url": "https://commons.wikimedia.org/wiki/Special:FilePath/A_mask_at_majuli_Chamaguri_Satra_ofthe_Ravana,_the_evil_king_og_theRepic_Ramayana.jpg"}, "start_date": {"year": "1600"}, "text": {"headline": "Living Tribal &amp; Folk Art &mdash; Bhaona Masks of Majuli", "text": "<p>Like Warli painting's ritual role among the Warli tribe of Maharashtra, Assam's Majuli satras keep alive hand-crafted bamboo, clay and cloth <strong>masks</strong> (this one depicting Ravana) worn in <em>Bhaona</em>, the centuries-old Vaishnavite dance-drama &mdash; sacred craft and community storytelling, still practised today and GI-tagged in 2024.</p>"}, "group": "Assam", "end_date": {"year": "2026"}}, {"media": {"url": "https://commons.wikimedia.org/wiki/Special:FilePath/View_of_the_Granary,_Gandikota.JPG"}, "start_date": {"year": "1650"}, "text": {"headline": "Qutb Shahi-to-Mughal Transition &mdash; Gandikota Fort, Kadapa", "text": "<p><strong>Gandikota Fort</strong>, on the Penna river in Kadapa district, passed through Qutb Shahi and then Mughal control after Aurangzeb's conquest of Golconda in 1687. Its 1650 Jama Masjid and this granary/armoury complex, built in Charminar-influenced Indo-Islamic style, mark the transition from Deccan Sultanate to Mughal military architecture in present-day Andhra Pradesh.</p>"}, "group": "Andhra Pradesh", "end_date": {"year": "1724"}}, {"media": {"url": "https://commons.wikimedia.org/wiki/Special:FilePath/Pinjore_Gardens.JPG"}, "start_date": {"year": "1661"}, "text": {"headline": "The Mughal Era &mdash; Pinjore (Yadavindra) Gardens", "text": "<p>Commissioned around 1661 CE by Nawab Fidai Khan, foster brother of Emperor Aurangzeb, <strong>Pinjore Gardens</strong> in Panchkula district is one of North India's finest surviving Mughal charbagh gardens, with terraced water channels, fountains, and the Sheesh Mahal, Rang Mahal and Jal Mahal pavilions.</p>"}, "group": "Haryana", "end_date": {"year": "1707"}}, {"media": {"url": "https://commons.wikimedia.org/wiki/Special:FilePath/Rang_ghar.JPG"}, "start_date": {"year": "1671"}, "text": {"headline": "Resisting the Mughals &mdash; Rang Ghar, Sivasagar", "text": "<p>Assam was never conquered by the Mughals: the Ahom kingdom repelled repeated invasions, decisively at the naval Battle of Saraighat (1671) under General Lachit Borphukan. It was this independence that let a distinct Ahom royal art flourish &mdash; exemplified by <strong>Rang Ghar</strong>, a two-storeyed royal amphitheatre (1746) with a roof shaped like an inverted royal boat and a pair of carved stone crocodile finials on its ridge, often called the 'Colosseum of the East'.</p>"}, "group": "Assam", "end_date": {"year": "1751"}}, {"media": {"url": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgMzAwIj4KPHJlY3Qgd2lkdGg9IjQwMCIgaGVpZ2h0PSIzMDAiIGZpbGw9IiNmNGVjZDgiLz4KPHJlY3QgeD0iMCIgeT0iMCIgd2lkdGg9IjQwMCIgaGVpZ2h0PSI4IiBmaWxsPSIjMmU2Zjk1Ii8+CjxlbGxpcHNlIGN4PSIyMDAiIGN5PSIxNDAiIHJ4PSI3NSIgcnk9Ijg4IiBmaWxsPSIjZDhiZDhlIiBzdHJva2U9IiMzYjJiMjAiIHN0cm9rZS13aWR0aD0iNCIvPgo8Y2lyY2xlIGN4PSIxNzIiIGN5PSIxMjIiIHI9IjExIiBmaWxsPSIjM2IyYjIwIi8+CjxjaXJjbGUgY3g9IjIyOCIgY3k9IjEyMiIgcj0iMTEiIGZpbGw9IiMzYjJiMjAiLz4KPHBhdGggZD0iTTE2MyAxNjggUTIwMCAxOTUgMjM3IDE2OCIgc3Ryb2tlPSIjM2IyYjIwIiBzdHJva2Utd2lkdGg9IjUiIGZpbGw9Im5vbmUiLz4KPHBhdGggZD0iTTE1MiA4OCBRMjAwIDYwIDI0OCA4OCIgc3Ryb2tlPSIjYzAzOTJiIiBzdHJva2Utd2lkdGg9IjYiIGZpbGw9Im5vbmUiLz4KPHRleHQgeD0iMjAwIiB5PSIyNTgiIGZvbnQtZmFtaWx5PSJHZW9yZ2lhLCBzZXJpZiIgZm9udC1zaXplPSIxNSIgZmlsbD0iIzNiMmIyMCIgdGV4dC1hbmNob3I9Im1pZGRsZSI+U2FuamhpIFJpdHVhbCBXYWxsICYgRmxvb3IgQXJ0PC90ZXh0Pgo8dGV4dCB4PSIyMDAiIHk9IjI3OCIgZm9udC1mYW1pbHk9Ikdlb3JnaWEsIHNlcmlmIiBmb250LXNpemU9IjEyIiBmaWxsPSIjMmU2Zjk1IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXdlaWdodD0iYm9sZCI+SGFyeWFuYTwvdGV4dD4KPC9zdmc+"}, "start_date": {"year": "1700"}, "text": {"headline": "Ritual Wall &amp; Floor Art &mdash; Sanjhi of Haryana", "text": "<p><em>Sanjhi</em> &mdash; ritual wall and floor art made from clay, cow-dung and rice paste &mdash; is drawn by rural women in Haryana (and across the old undivided Punjab region) during festivals such as Teej and Diwali. Like Warli painting, it uses simple natural materials and symbolic, geometric motifs handed down through generations rather than individual authorship.</p>"}, "group": "Haryana", "end_date": {"year": "2026"}}, {"media": {"url": "https://commons.wikimedia.org/wiki/Special:FilePath/Phulkari_from_Punjab,_India,_20th_century,_khadi,_silk,_plain_weave,_embroidery,_Honolulu_Museum_of_Art.JPG"}, "start_date": {"year": "1800"}, "text": {"headline": "Folk Embroidery &amp; Motif Art &mdash; Phulkari of Haryana", "text": "<p><strong>Phulkari</strong> ('flower work') embroidery, practised by rural women across Haryana (and the wider undivided Punjab region), stitches vivid floral and geometric motifs onto handwoven cloth for weddings and festivals &mdash; echoing Madhubani's role as a folk art of celebration and domestic ritual.</p>"}, "group": "Haryana", "end_date": {"year": "2026"}}]};
